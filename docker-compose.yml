version: "3.9"

services:
  wafabeauty_database:
    image: postgres:15-alpine
    container_name: wafabeauty_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: wafabeauty
      POSTGRES_USER: wafabeauty
      POSTGRES_PASSWORD: wafabeauty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafabeauty -d wafabeauty"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wafabeauty_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wafabeauty:wafabeauty@wafabeauty_database:5432/wafabeauty
    ports:
      - "8000:8000"
    depends_on:
      wafabeauty_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wafabeauty_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: wafabeauty_network
